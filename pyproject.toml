[project]
name = "info-map"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.142.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "ruff>=0.16.9",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 92
target-version = "py313"
exclude = [
    ".git",
    "__pycache__",
    "venv",
    "alembic/versions",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["F811", "E501"]